version: 2

models:
  - name: stg_token_transfers
    description: Transactions in the Etherum Blockchain
    columns:
      - name: transaction_hash
        data_tests:
          - relationships:
              to: ref('stg_transactions')
              field: hash
  - name: int_transactions_enriched
    columns:
      - name: value
        data_tests:
          - assert_value_amount_is_positive:
              field: block_number
  - name: stg_transactions
    description: "{{ doc('transactions') }}"
    columns:
      - name: hash
        description: >
          This is a very long multiline description about the unique
          identifier of each transaction in the Ethereum blockchain
        data_tests:
          - unique
          - not_null
          # - relationships:
          #     to: ref('stg_token_transfers')
          #     field: transaction_hash
          #     severity: warn
          #     config:
          #       store_failures: true
          #       store_failures_as: table
          #       where: date > current_date - 25
  - name: stablecoin_activity_per_day
    latest_version: 1
    config:
      contract:
        enforced: true
    columns:
      - name: date
        data_type: date
      - name: token_address
        data_type: varchar
      - name: type
        data_type: varchar
        data_tests:
          - accepted_values:
              values: ["Hybrid","Crypto-backed","Fiat-backed"]
      - name: symbol
        data_type: varchar
      - name: total_usd_value
        data_type: float

    versions:    
      - v: 1
        deprecation_date: 2030-01-01
        # Matches what's above -- nothing more needed    
      - v: 2
        columns:
          - include: all
            exclude: [token_address, symbol]

unit_tests:
  - name: test_is_valid_transation_category_breakdown
    model: int_transactions_enriched
    overrides:
      macros:
        # unit test this model in "full refresh" mode
        is_incremental: false
    given:
      - input: ref('stg_transactions')
        format: dict
        rows:
          - {receipt_contract_address: 'bla'}
      - input: ref('stg_token_transfers')
      # must be present as an input, even if it is not tested
        format: dict
        rows:
          - {transaction_hash: 'bla'}
    expect:
      format: dict
      rows:
        - {transaction_category: 'contract_creation'}
